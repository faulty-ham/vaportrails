name: Weekly Supabase Backup

on:
  schedule:
    - cron: '0 6 * * 0'  # Every Sunday at 6:00 AM UTC
  workflow_dispatch:       # Also allows manual trigger from GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from Supabase
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Accept: application/json" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/strains?select=*&order=id.asc" \
            -o backups/strains.json

      - name: Commit and push backup
        run: |
          git config user.name  "VaporTrails Backup Bot"
          git config user.email "backup-bot@vaportrails"
          git add backups/strains.json
          git diff --cached --quiet || git commit -m "chore: weekly backup $(date -u '+%Y-%m-%d')"
          git push
